services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: jobsearch
      POSTGRES_USER: jobsearch
      POSTGRES_PASSWORD: localdev
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobsearch"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    ports:
      - "8080:8080"
    environment:
      DATABASE_URL: postgresql+asyncpg://jobsearch:localdev@postgres:5432/jobsearch
      DATABASE_URL_SYNC: postgresql://jobsearch:localdev@postgres:5432/jobsearch
      REDIS_URL: redis://redis:6379/0
      DEBUG: "true"
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: ..
      dockerfile: backend/Dockerfile.worker
    environment:
      DATABASE_URL: postgresql+asyncpg://jobsearch:localdev@postgres:5432/jobsearch
      DATABASE_URL_SYNC: postgresql://jobsearch:localdev@postgres:5432/jobsearch
      REDIS_URL: redis://redis:6379/0
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  pgdata:
