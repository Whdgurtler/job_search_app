version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: jobsearch_postgres
    environment:
      POSTGRES_DB: jobsearch
      POSTGRES_USER: jobsearch
      POSTGRES_PASSWORD: localdev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jobsearch"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: jobsearch_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile.api
    container_name: jobsearch_api
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql+asyncpg://jobsearch:localdev@postgres:5432/jobsearch
      - DATABASE_URL_SYNC=postgresql://jobsearch:localdev@postgres:5432/jobsearch
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=development
      - FIREBASE_CREDENTIALS_PATH=/app/firebase-credentials.json
    volumes:
      - .:/app
      - ./backend:/app/backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn backend.app.main:app --host 0.0.0.0 --port 8000 --reload

  worker:
    build:
      context: .
      dockerfile: backend/Dockerfile.worker
    container_name: jobsearch_worker
    environment:
      - DATABASE_URL=postgresql+asyncpg://jobsearch:localdev@postgres:5432/jobsearch
      - DATABASE_URL_SYNC=postgresql://jobsearch:localdev@postgres:5432/jobsearch
      - REDIS_URL=redis://redis:6379/0
      - ENVIRONMENT=development
    volumes:
      - .:/app
      - ./backend:/app/backend
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A backend.app.tasks.celery_app worker --loglevel=info

volumes:
  postgres_data:
