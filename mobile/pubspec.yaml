name: job_search_agent
description: AI-powered job search and matching mobile app.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.0
  flutter: ^3.27.0

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.12.0
  firebase_auth: ^5.6.0

  # State Management
  flutter_riverpod: ^2.6.0
  riverpod_annotation: ^2.6.0

  # HTTP
  dio: ^5.8.0

  # Navigation
  go_router: ^15.1.0

  # File handling
  file_picker: ^9.2.0
  url_launcher: ^6.3.0

  # UI
  shimmer: ^3.0.0
  cached_network_image: ^3.4.0

  # Data
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.0
  intl: ^0.20.0

  # Secure storage
  flutter_secure_storage: ^9.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  build_runner: ^2.4.0
  json_serializable: ^6.9.0
  freezed: ^2.5.0
  riverpod_generator: ^2.6.0

flutter:
  uses-material-design: true
